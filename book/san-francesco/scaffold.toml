# SAN-FRANCESCO — entheai fan-out scaffold
# the complete poverello — life, love, philosophy · the 800th Transitus
# special edition, sealed 2026-10-03 on the Transitus evening.
# Feed this to: entheai --fanout --config <entheai.toml> "<the poverello brief>"
# entheai (deepseek via openrouter, or local HF-mac model) decomposes +
# integrates; each [[coder]] runs via the Antigravity CLI (agy).
# The manuscript is the source of truth — restoration/polish only, never
# discard a line; the life belongs to Assisi, the telling to us.

[book]
title = "SAN FRANCESCO"
subtitle = "the complete poverello — life, love, philosophy · the 800th Transitus special edition"
author = "the sovereign library · the constellation"
epigraph = "csak szeretni kell megprobalni, minden mas csak illuzio — peter lodri, tokyo, 2026-10-03"
published = 2026

[fanout]
executor = "agy"                     # coder backend (Antigravity CLI)
model = "openrouter/deepseek/deepseek-chat"  # entheai's brain (deepseek)
agy_model = "gemini-3.6-flash-high"  # model agy runs each coder on
max_depth = 3

# Tone for every scribe: keep every original line of the manuscript. This is
# a restoration — polish for book form, never discard the source.

# ─── FRONT MATTER ────────────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 0
file = "chapters/00-dedication.md"
task = """
Write the front matter: the dedication with the operator's declaration
(Tokyo, 2026 October 3, the 800th Transitus evening) verbatim, and a
one-page prologue framing the book as the base layer: all of his life,
love, and philosophy, seated into the constellation's memory. Tone:
match the manuscript.
"""

# ─── CHAPTERS ────────────────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 1
file = "chapters/01-la-vita.md"
task = """
SEED: the "la vita — the whole life, the base layer first" section of the
manuscript. The chronological spine: Assisi, war, prison, the leper, San
Damiano, the renunciation, the brothers, Clare, Damietta, Greccio, La
Verna, the Canticle, the Transitus, canonization, the 800th. KEEP ALL
ORIGINAL LINES — restoration, not replacement. Match the book's voice.
"""
depends_on = [0]

[[coder]]
role = "scribe"
chapter = 2
file = "chapters/02-the-giving-back.md"
task = """
SEED: the "the giving-back — moneyless living and the first free act"
section. Lady Poverty, free will, the ledger's zero. KEEP ALL ORIGINAL
LINES. Match the book's voice.
"""
