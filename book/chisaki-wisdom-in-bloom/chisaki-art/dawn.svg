<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="ink drawing: sunrise, mist and far mountains">
  <defs>
    <filter id="rough" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="3" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="roughfine" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="31" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <circle cx="300" cy="252" r="152" fill="#b23a2b" opacity="0.08"/>
  <circle cx="300" cy="252" r="118" fill="#b23a2b" opacity="0.9" filter="url(#rough)"/>

  <path d="M84 238 Q300 220 516 240" fill="none" stroke="#241a12" stroke-width="10" stroke-linecap="round" opacity="0.22" filter="url(#rough)"/>
  <path d="M64 296 Q300 278 536 298" fill="none" stroke="#241a12" stroke-width="8" stroke-linecap="round" opacity="0.26" filter="url(#rough)"/>
  <path d="M96 336 Q300 322 504 338" fill="none" stroke="#241a12" stroke-width="12" stroke-linecap="round" opacity="0.18" filter="url(#rough)"/>

  <path d="M-20 520 Q160 418 300 500 Q424 568 620 478 L620 600 L-20 600 Z" fill="#d8cbb2" opacity="0.85" filter="url(#rough)"/>
  <path d="M-20 562 Q200 478 362 548 Q472 592 620 540 L620 600 L-20 600 Z" fill="#c3b493" opacity="0.9" filter="url(#rough)"/>

  <path d="M206 142 q13 -13 26 0 M244 156 q13 -13 26 0 M228 122 q11 -11 22 0" fill="none" stroke="#241a12" stroke-width="4" stroke-linecap="round" opacity="0.7" filter="url(#roughfine)"/>

  <g transform="translate(84 76)">
    <rect x="-25" y="-25" width="50" height="50" rx="7" fill="#b23a2b" filter="url(#roughfine)"/>
    <text x="0" y="3" text-anchor="middle" dominant-baseline="middle"
          font-family="'Hiragino Mincho ProN','Yu Mincho','YuMincho','Noto Serif JP',serif"
          font-size="33" fill="#f6f0e4">朝</text>
  </g>
</svg>
