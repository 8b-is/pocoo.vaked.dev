<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#060a08;">
    <defs>
        <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
            <stop offset="0%" stop-color="hsla(195, 100%, 50%, 0.18)" />
            <stop offset="100%" stop-color="#060a08" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="bgGlow2" cx="80%" cy="70%" r="60%">
            <stop offset="0%" stop-color="hsla(240, 100%, 50%, 0.12)" />
            <stop offset="100%" stop-color="#060a08" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="laneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="hsl(195, 85%, 60%)" stop-opacity="0.8" />
            <stop offset="100%" stop-color="hsl(240, 90%, 65%)" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="hsl(195, 85%, 60%)" stop-opacity="0.4" />
            <stop offset="50%" stop-color="hsl(240, 90%, 65%)" stop-opacity="0.2" />
            <stop offset="100%" stop-color="hsl(195, 85%, 60%)" stop-opacity="0.5" />
        </linearGradient>
        <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#122018" stroke-width="0.75" stroke-opacity="0.6"/>
        </pattern>
    </defs>

    <!-- Background Layers -->
    <rect width="1200" height="630" fill="#060a08" />
    <rect width="1200" height="630" fill="url(#gridPattern)" />
    <rect width="1200" height="630" fill="url(#bgGlow1)" />
    <rect width="1200" height="630" fill="url(#bgGlow2)" />

    <!-- Outer Frame -->
    <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" />

    <!-- Header / Brand -->
    <g transform="translate(80, 75)">
        <circle cx="12" cy="12" r="8" fill="hsl(195, 85%, 60%)" />
        <circle cx="12" cy="12" r="14" fill="none" stroke="hsl(195, 85%, 60%)" stroke-opacity="0.5" stroke-width="1" />
        <text x="36" y="17" fill="#ffffff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" letter-spacing="2">POCOO.VAKED.DEV</text>
        <text x="210" y="17" fill="#7a8b7f" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1">// SOVEREIGN RESEARCH ARCHIVE</text>
    </g>

    <!-- Tags -->
    
        <g transform="translate(80, 115)">
            <rect width="108" height="26" rx="13" fill="hsla(240, 100%, 50%, 0.12)" stroke="hsl(240, 90%, 65%)" stroke-opacity="0.6" stroke-width="1" />
            <text x="54.0" y="17" fill="hsl(240, 90%, 65%)" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">#engineering</text>
        </g>
        
        <g transform="translate(198, 115)">
            <rect width="60" height="26" rx="13" fill="hsla(240, 100%, 50%, 0.12)" stroke="hsl(240, 90%, 65%)" stroke-opacity="0.6" stroke-width="1" />
            <text x="30.0" y="17" fill="hsl(240, 90%, 65%)" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">#rust</text>
        </g>
        
        <g transform="translate(268, 115)">
            <rect width="60" height="26" rx="13" fill="hsla(240, 100%, 50%, 0.12)" stroke="hsl(240, 90%, 65%)" stroke-opacity="0.6" stroke-width="1" />
            <text x="30.0" y="17" fill="hsl(240, 90%, 65%)" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">#zig</text>
        </g>
        
        <g transform="translate(338, 115)">
            <rect width="60" height="26" rx="13" fill="hsla(240, 100%, 50%, 0.12)" stroke="hsl(240, 90%, 65%)" stroke-opacity="0.6" stroke-width="1" />
            <text x="30.0" y="17" fill="hsl(240, 90%, 65%)" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">#wupz</text>
        </g>
        

    <!-- Title & Desc Block -->
    <g>
        <text x="80" y="200" fill="#ffffff" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.8))">wupz — the link kompresses,</text>
<text x="80" y="256" fill="#ffffff" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.8))">and it runs</text>
        <text x="80" y="327" fill="#a3b8ab" font-family="ui-monospace, monospace" font-size="15" opacity="0.85">wupz went from a design doc to working code on</text>
<text x="80" y="351" fill="#a3b8ab" font-family="ui-monospace, monospace" font-size="15" opacity="0.85">two toolchains in one day: a Rust layout plan...</text>
    </g>

    <!-- Graphic Motif (Right Side) -->
    <g><rect x="800" y="170" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="170" width="165.0" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="186" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 00</text><text x="1090" y="186" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="11">120 µs</text><rect x="800" y="206" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="206" width="174.0" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="222" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 01</text><text x="1090" y="222" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="11">144 µs</text><rect x="800" y="242" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="242" width="174.0" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="258" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 02</text><text x="1090" y="258" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="11">144 µs</text><rect x="800" y="278" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="278" width="223.5" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="294" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 03</text><text x="1090" y="294" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="11">276 µs</text><rect x="800" y="314" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="314" width="136.5" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="330" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 04</text><text x="1090" y="330" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="11">44 µs</text><rect x="800" y="350" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="350" width="141.0" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="366" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 05</text><text x="1090" y="366" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="11">56 µs</text><rect x="800" y="386" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="386" width="262.5" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="402" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 06</text><text x="1090" y="402" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="11">380 µs</text><rect x="800" y="422" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="422" width="220.5" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="438" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 07</text><text x="1090" y="438" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="11">268 µs</text><text x="940" y="490" fill="hsl(195, 85%, 60%)" font-family="monospace" font-size="13" letter-spacing="3" text-anchor="middle">SIMDGROUP GEMM // ZERO-ALLOCATION</text></g>

    <!-- Bottom Footer Bar -->
    <g transform="translate(80, 565)">
        <line x1="0" y1="-20" x2="1040" y2="-20" stroke="#1f3328" stroke-width="1" />
        <text x="0" y="5" fill="#7a8b7f" font-family="ui-monospace, monospace" font-size="13">DATE: 2026-10-10</text>
        <text x="220" y="5" fill="#7a8b7f" font-family="ui-monospace, monospace" font-size="13">AUTHOR: PÉTER LODRI</text>
        <text x="520" y="5" fill="hsl(195, 85%, 60%)" font-family="ui-monospace, monospace" font-size="13" font-weight="600">HASH: #9c3b2c62e590</text>
        <text x="1040" y="5" fill="hsl(240, 90%, 65%)" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="end">WE. {-1, 0, +1}. &lt;3</text>
    </g>
</svg>