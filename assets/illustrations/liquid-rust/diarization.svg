<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0e1424" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 7 4 L 0 6.5 z" fill="#7f7c99"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 7 4 L 0 6.5 z" fill="#b48bff"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="1200" height="620" fill="#05060a"/>
  <rect x="0" y="0" width="1200" height="620" fill="url(#vignette)"/>

  <!-- Header -->
  <text x="60" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#7f7c99" letter-spacing="3.5">ACOUSTIC FEATURE SPACE · SPEAKER SEPARATION</text>
  <text x="60" y="72" font-family="Georgia,serif" font-size="26" fill="#cfc9dd">diarization by physics</text>

  <!-- Main plot panel -->
  <rect x="60" y="92" width="1080" height="368" rx="10" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1"/>

  <!-- Plot inner canvas -->
  <rect x="160" y="118" width="920" height="284" rx="10" fill="#0e1424" stroke="rgba(170,150,255,0.28)" stroke-width="1"/>

  <!-- Subtle grid lines -->
  <g stroke="rgba(170,150,255,0.18)" stroke-width="1">
    <line x1="160" y1="175" x2="1080" y2="175"/>
    <line x1="160" y1="232" x2="1080" y2="232"/>
    <line x1="160" y1="288" x2="1080" y2="288"/>
    <line x1="160" y1="345" x2="1080" y2="345"/>
    <line x1="344" y1="118" x2="344" y2="402"/>
    <line x1="528" y1="118" x2="528" y2="402"/>
    <line x1="712" y1="118" x2="712" y2="402"/>
    <line x1="896" y1="118" x2="896" y2="402"/>
  </g>

  <!-- Axes -->
  <line x1="160" y1="402" x2="1094" y2="402" stroke="#7f7c99" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="160" y1="402" x2="160" y2="106" stroke="#7f7c99" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Axis ticks and numeric scale -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#5b577a">
    <text x="160" y="420" text-anchor="middle">0.00</text>
    <text x="344" y="420" text-anchor="middle">0.01</text>
    <text x="528" y="420" text-anchor="middle">0.02</text>
    <text x="712" y="420" text-anchor="middle">0.03</text>
    <text x="896" y="420" text-anchor="middle">0.04</text>
    <text x="1080" y="420" text-anchor="middle">0.05</text>

    <text x="148" y="405" text-anchor="end">0.00</text>
    <text x="148" y="348" text-anchor="end">0.02</text>
    <text x="148" y="291" text-anchor="end">0.04</text>
    <text x="148" y="235" text-anchor="end">0.06</text>
    <text x="148" y="178" text-anchor="end">0.08</text>
  </g>

  <!-- Axis labels -->
  <text x="620" y="444" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#cfc9dd">period jitter Jp</text>
  <text x="98" y="260" text-anchor="middle" transform="rotate(-90 98 260)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#cfc9dd">amplitude jitter Ja</text>

  <!-- Centroid connection vector (faint reference) -->
  <line x1="362" y1="328" x2="842" y2="196" stroke="#5b577a" stroke-width="1" stroke-dasharray="2,4"/>

  <!-- K-means centroid boundary (dashed line midway between clusters) -->
  <line x1="510" y1="126" x2="694" y2="394" stroke="#b48bff" stroke-width="1.5" stroke-dasharray="7,5"/>

  <!-- Boundary callout label -->
  <rect x="462" y="132" width="276" height="28" rx="10" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1"/>
  <text x="600" y="150" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#b48bff">K-means centroid boundary, K=2</text>

  <!-- Cluster 1: Speaker A (left/lower cluster, mint #62e6c9, 14 dots, r=4) -->
  <g fill="#62e6c9">
    <circle cx="292" cy="342" r="4"/>
    <circle cx="310" cy="318" r="4"/>
    <circle cx="318" cy="354" r="4"/>
    <circle cx="332" cy="302" r="4"/>
    <circle cx="340" cy="330" r="4"/>
    <circle cx="348" cy="360" r="4"/>
    <circle cx="358" cy="312" r="4"/>
    <circle cx="366" cy="340" r="4"/>
    <circle cx="376" cy="294" r="4"/>
    <circle cx="384" cy="324" r="4"/>
    <circle cx="394" cy="350" r="4"/>
    <circle cx="406" cy="308" r="4"/>
    <circle cx="416" cy="334" r="4"/>
    <circle cx="430" cy="318" r="4"/>
  </g>
  <!-- Speaker A centroid ring & label -->
  <circle cx="362" cy="328" r="8" fill="none" stroke="#62e6c9" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="260" y="246" width="116" height="28" rx="10" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1"/>
  <text x="318" y="264" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#62e6c9">Speaker A</text>

  <!-- Cluster 2: Speaker B (right/upper cluster, gold #e8b05c, 14 dots, r=4) -->
  <g fill="#e8b05c">
    <circle cx="768" cy="214" r="4"/>
    <circle cx="782" cy="186" r="4"/>
    <circle cx="792" cy="226" r="4"/>
    <circle cx="804" cy="170" r="4"/>
    <circle cx="814" cy="202" r="4"/>
    <circle cx="824" cy="232" r="4"/>
    <circle cx="834" cy="180" r="4"/>
    <circle cx="844" cy="208" r="4"/>
    <circle cx="854" cy="162" r="4"/>
    <circle cx="864" cy="192" r="4"/>
    <circle cx="876" cy="220" r="4"/>
    <circle cx="888" cy="174" r="4"/>
    <circle cx="902" cy="200" r="4"/>
    <circle cx="916" cy="182" r="4"/>
  </g>
  <!-- Speaker B centroid ring & label -->
  <circle cx="842" cy="196" r="8" fill="none" stroke="#e8b05c" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="862" y="236" width="116" height="28" rx="10" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1"/>
  <text x="920" y="254" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#e8b05c">Speaker B</text>

  <!-- Three monospace lines under the plot -->
  <rect x="60" y="476" width="1080" height="96" rx="10" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" text-anchor="middle">
    <text x="600" y="502" fill="#62e6c9">measure, don't assume</text>
    <text x="600" y="528" fill="#cfc9dd">no embeddings · CPU only · O(N log N)</text>
    <text x="600" y="554" fill="#7f7c99">auditable: plot the scatter and prove it</text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="600" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#5b577a" letter-spacing="2">liquid-rust · Phoenix Protocol v1</text>
</svg>
