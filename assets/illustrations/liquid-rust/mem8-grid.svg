<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e1424" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#05060a" stop-opacity="0" />
    </radialGradient>
    <marker id="arrow-mint" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#62e6c9" />
    </marker>
    <marker id="arrow-axis" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#7f7c99" />
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect width="1200" height="640" fill="#05060a" />
  <rect width="1200" height="640" fill="url(#vignette)" />

  <!-- Outer frame -->
  <rect x="36" y="24" width="1128" height="564" rx="10" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1" />

  <!-- Header -->
  <text x="68" y="58" fill="#62e6c9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="3.5">MEM|8 SPATIAL INDEX · ACOUSTIC TELEMETRY ENCODING</text>
  <text x="68" y="90" fill="#cfc9dd" font-family="Georgia,serif" font-size="26">voice as a coordinate</text>
  <line x1="36" y1="110" x2="1164" y2="110" stroke="rgba(170,150,255,0.18)" stroke-width="1" />

  <!-- ====================================================================== -->
  <!-- LEFT SIDE: ISOMETRIC 3D ACOUSTIC BOX                                   -->
  <!-- ====================================================================== -->
  <rect x="68" y="132" width="528" height="432" rx="10" fill="#0e1424" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
  <text x="94" y="160" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="3">3D ACOUSTIC COORDINATE SPACE · [0..255]³</text>

  <!-- Isometric 3D Box Faces (subtle fill for depth) -->
  <!-- Vertices:
       V000 = (165, 390)   [origin: bottom-left]
       V100 = (315, 440)   [X corner: bottom-front]
       V010 = (275, 335)   [Y corner: bottom-back]
       V110 = (425, 385)   [X+Y corner: bottom-right]
       V001 = (165, 240)   [Z corner: top-left]
       V101 = (315, 290)   [X+Z corner: top-front]
       V011 = (275, 185)   [Y+Z corner: top-back]
       V111 = (425, 235)   [X+Y+Z corner: top-right]
  -->
  <!-- Floor plane (Z = 0) -->
  <polygon points="165,390 315,440 425,385 275,335" fill="#0b0f19" fill-opacity="0.55" />

  <!-- Floor grid lines (rgba(170,150,255,0.18)) -->
  <line x1="215" y1="406.7" x2="325" y2="351.7" stroke="rgba(170,150,255,0.18)" stroke-width="1" />
  <line x1="265" y1="423.3" x2="375" y2="368.3" stroke="rgba(170,150,255,0.18)" stroke-width="1" />
  <line x1="201.7" y1="371.7" x2="351.7" y2="421.7" stroke="rgba(170,150,255,0.18)" stroke-width="1" />
  <line x1="238.3" y1="353.3" x2="388.3" y2="403.3" stroke="rgba(170,150,255,0.18)" stroke-width="1" />

  <!-- Back-left vertical grid lines -->
  <line x1="165" y1="340" x2="275" y2="285" stroke="rgba(170,150,255,0.18)" stroke-width="1" />
  <line x1="165" y1="290" x2="275" y2="235" stroke="rgba(170,150,255,0.18)" stroke-width="1" />

  <!-- Back-right vertical grid lines -->
  <line x1="275" y1="285" x2="425" y2="335" stroke="rgba(170,150,255,0.18)" stroke-width="1" />
  <line x1="275" y1="235" x2="425" y2="285" stroke="rgba(170,150,255,0.18)" stroke-width="1" />

  <!-- Hidden back edges (dashed) -->
  <line x1="165" y1="390" x2="275" y2="335" stroke="rgba(170,150,255,0.28)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="275" y1="335" x2="425" y2="385" stroke="rgba(170,150,255,0.28)" stroke-width="1" stroke-dasharray="4 4" />
  <line x1="275" y1="335" x2="275" y2="185" stroke="rgba(170,150,255,0.28)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Query range sub-box (X 200..210, Y 75..85, Z 205..215) around the highlighted voice -->
  <g stroke="#62e6c9" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 2" fill="#62e6c9" fill-opacity="0.06">
    <polygon points="348,268 370,275 382,267 360,260" />
    <polygon points="348,250 370,257 382,249 360,242" />
    <line x1="348" y1="268" x2="348" y2="250" />
    <line x1="370" y1="275" x2="370" y2="257" />
    <line x1="382" y1="267" x2="382" y2="249" />
    <line x1="360" y1="260" x2="360" y2="242" />
  </g>

  <!-- Neighbor glowing dots inside the 3D box (with vertical drop stems to floor) -->
  <!-- Dot 1: violet -->
  <line x1="232" y1="306" x2="232" y2="384" stroke="#b48bff" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="232" cy="384" r="2" fill="#b48bff" fill-opacity="0.4" />
  <circle cx="232" cy="306" r="9" fill="#b48bff" fill-opacity="0.14" />
  <circle cx="232" cy="306" r="5" fill="#b48bff" fill-opacity="0.32" />
  <circle cx="232" cy="306" r="2.8" fill="#b48bff" />

  <!-- Dot 2: gold -->
  <line x1="286" y1="248" x2="286" y2="364" stroke="#e8b05c" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="286" cy="364" r="2" fill="#e8b05c" fill-opacity="0.4" />
  <circle cx="286" cy="248" r="9" fill="#e8b05c" fill-opacity="0.14" />
  <circle cx="286" cy="248" r="5" fill="#e8b05c" fill-opacity="0.32" />
  <circle cx="286" cy="248" r="2.8" fill="#e8b05c" />

  <!-- Dot 3: cyan -->
  <line x1="342" y1="336" x2="342" y2="404" stroke="#00f0ff" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="342" cy="404" r="2" fill="#00f0ff" fill-opacity="0.4" />
  <circle cx="342" cy="336" r="9" fill="#00f0ff" fill-opacity="0.14" />
  <circle cx="342" cy="336" r="5" fill="#00f0ff" fill-opacity="0.32" />
  <circle cx="342" cy="336" r="2.8" fill="#00f0ff" />

  <!-- Dot 4: faint violet -->
  <line x1="258" y1="332" x2="258" y2="395" stroke="#7f7c99" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 2" />
  <circle cx="258" cy="332" r="7" fill="#7f7c99" fill-opacity="0.18" />
  <circle cx="258" cy="332" r="2.5" fill="#cfc9dd" fill-opacity="0.75" />

  <!-- Highlighted Dot in Mint: 'a voice' at (365, 258) -->
  <line x1="365" y1="258" x2="365" y2="390" stroke="#62e6c9" stroke-opacity="0.55" stroke-width="1" stroke-dasharray="3 3" />
  <ellipse cx="365" cy="390" rx="5" ry="2.5" fill="#62e6c9" fill-opacity="0.35" />
  <circle cx="365" cy="258" r="16" fill="#62e6c9" fill-opacity="0.12" />
  <circle cx="365" cy="258" r="10" fill="#62e6c9" fill-opacity="0.28" />
  <circle cx="365" cy="258" r="5" fill="#62e6c9" />
  <circle cx="365" cy="258" r="2" fill="#05060a" />

  <!-- Label 'a voice' attached to the highlighted mint dot -->
  <rect x="312" y="198" width="76" height="24" rx="6" fill="#0b0f19" stroke="#62e6c9" stroke-width="1" />
  <text x="350" y="214" text-anchor="middle" fill="#62e6c9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">a voice</text>
  <line x1="355" y1="222" x2="363" y2="248" stroke="#62e6c9" stroke-width="1" />

  <!-- Visible outer wireframe edges of the 3D box -->
  <!-- Top face -->
  <polygon points="165,240 315,290 425,235 275,185" fill="none" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
  <!-- Front-left and Front-right bottom edges -->
  <line x1="165" y1="390" x2="315" y2="440" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
  <line x1="315" y1="440" x2="425" y2="385" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
  <!-- Vertical pillars -->
  <line x1="165" y1="390" x2="165" y2="240" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
  <line x1="315" y1="440" x2="315" y2="290" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
  <line x1="425" y1="385" x2="425" y2="235" stroke="rgba(170,150,255,0.28)" stroke-width="1" />

  <!-- 3 Coordinate Axes (X, Y, Z) with directional arrows and labels -->
  <!-- X Axis: arousal / shimmer -->
  <line x1="165" y1="390" x2="345" y2="450" stroke="#7f7c99" stroke-width="1.5" marker-end="url(#arrow-axis)" />
  <text x="235" y="466" text-anchor="middle" fill="#e8b05c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">X = arousal / shimmer</text>

  <!-- Y Axis: dominance / jitter -->
  <line x1="315" y1="440" x2="452" y2="371.5" stroke="#7f7c99" stroke-width="1.5" marker-end="url(#arrow-axis)" />
  <text x="460" y="418" text-anchor="middle" fill="#b48bff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">Y = dominance / jitter</text>

  <!-- Z Axis: pitch / F0 -->
  <line x1="165" y1="390" x2="165" y2="205" stroke="#7f7c99" stroke-width="1.5" marker-end="url(#arrow-axis)" />
  <text x="165" y="192" text-anchor="middle" fill="#00f0ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700">Z = pitch / F0</text>

  <!-- Origin label -->
  <text x="152" y="398" text-anchor="end" fill="#5b577a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">(0,0,0)</text>

  <!-- Range query note box inside left panel -->
  <rect x="94" y="504" width="476" height="38" rx="8" fill="#0b0f19" stroke="#62e6c9" stroke-opacity="0.45" stroke-width="1" />
  <circle cx="114" cy="523" r="4" fill="#62e6c9" />
  <text x="128" y="527" fill="#cfc9dd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5">query by range: <tspan fill="#62e6c9">X 200..210, Y 75..85, Z 205..215</tspan></text>

  <!-- ====================================================================== -->
  <!-- ARROW FROM HIGHLIGHTED DOT TO BINARY PAYLOAD                           -->
  <!-- ====================================================================== -->
  <path d="M 381 258 L 556 258 L 580 282 L 664 282" fill="none" stroke="#62e6c9" stroke-width="1.5" marker-end="url(#arrow-mint)" />
  <rect x="582" y="242" width="54" height="20" rx="5" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
  <text x="609" y="256" text-anchor="middle" fill="#62e6c9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">AYE8</text>

  <!-- ====================================================================== -->
  <!-- RIGHT SIDE: BINARY PAYLOAD STACK 'AYE8 v1'                             -->
  <!-- ====================================================================== -->
  <rect x="644" y="132" width="488" height="432" rx="10" fill="#0e1424" stroke="rgba(170,150,255,0.28)" stroke-width="1" />

  <!-- Payload header -->
  <text x="672" y="162" fill="#62e6c9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" font-weight="700">AYE8 v1</text>
  <text x="752" y="162" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="3">· BINARY PAYLOAD FRAME</text>
  <text x="1104" y="162" text-anchor="end" fill="#5b577a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11">little-endian</text>

  <!-- Row 1: magic 'AYE8' -->
  <g>
    <rect x="672" y="180" width="432" height="36" rx="6" fill="#0b0f19" stroke="#e8b05c" stroke-opacity="0.55" stroke-width="1" />
    <text x="690" y="203" fill="#e8b05c" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">magic 'AYE8'</text>
    <text x="1088" y="203" text-anchor="end" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">4B · 0x41 59 45 38</text>
  </g>

  <!-- Row 2: version -->
  <g>
    <rect x="672" y="222" width="432" height="36" rx="6" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
    <text x="690" y="245" fill="#cfc9dd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">version</text>
    <text x="1088" y="245" text-anchor="end" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">u8 · v1 (0x01)</text>
  </g>

  <!-- Row 3: valence/arousal/dominance (3 x f32) -->
  <g>
    <rect x="672" y="264" width="432" height="36" rx="6" fill="#0b0f19" stroke="#62e6c9" stroke-opacity="0.85" stroke-width="1" />
    <text x="690" y="287" fill="#62e6c9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700">valence/arousal/dominance (3 x f32)</text>
    <text x="1088" y="287" text-anchor="end" fill="#62e6c9" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">12B · 3D coord</text>
  </g>

  <!-- Row 4: salience -->
  <g>
    <rect x="672" y="306" width="432" height="36" rx="6" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
    <text x="690" y="329" fill="#cfc9dd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">salience</text>
    <text x="1088" y="329" text-anchor="end" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">f32 · Marine Jp / Ja</text>
  </g>

  <!-- Row 5: voice_conf -->
  <g>
    <rect x="672" y="348" width="432" height="36" rx="6" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
    <text x="690" y="371" fill="#cfc9dd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">voice_conf</text>
    <text x="1088" y="371" text-anchor="end" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">f32 · [0.0..1.0]</text>
  </g>

  <!-- Row 6: duration -->
  <g>
    <rect x="672" y="390" width="432" height="36" rx="6" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
    <text x="690" y="413" fill="#cfc9dd" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">duration</text>
    <text x="1088" y="413" text-anchor="end" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">f32 · seconds</text>
  </g>

  <!-- Row 7: f0_estimate -->
  <g>
    <rect x="672" y="432" width="432" height="36" rx="6" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1" />
    <text x="690" y="455" fill="#00f0ff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">f0_estimate</text>
    <text x="1088" y="455" text-anchor="end" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">f32 · pitch Hz</text>
  </g>

  <!-- Row 8: text (utf-8) -->
  <g>
    <rect x="672" y="474" width="432" height="36" rx="6" fill="#0b0f19" stroke="#ff4d9d" stroke-opacity="0.55" stroke-width="1" />
    <text x="690" y="497" fill="#ff4d9d" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">text (utf-8)</text>
    <text x="1088" y="497" text-anchor="end" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">u16 len + [u8]</text>
  </g>

  <!-- Row 9: optional speaker -->
  <g>
    <rect x="672" y="516" width="432" height="36" rx="6" fill="#0b0f19" stroke="rgba(170,150,255,0.28)" stroke-width="1" stroke-dasharray="4 3" />
    <text x="690" y="539" fill="#b48bff" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">optional speaker</text>
    <text x="1088" y="539" text-anchor="end" fill="#7f7c99" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5">tag ? speaker_id</text>
  </g>

  <!-- Bottom caption -->
  <text x="600" y="616" text-anchor="middle" fill="#5b577a" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="2">liquid-rust · MEM|8 acoustic bridge</text>
</svg>
