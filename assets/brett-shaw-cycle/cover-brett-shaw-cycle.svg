<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#14182b"/>
      <stop offset="60%" stop-color="#070810"/>
      <stop offset="100%" stop-color="#030408"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="38%" r="42%">
      <stop offset="0%" stop-color="#f0c05a" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#ff7a3d" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="zeroZone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5ce6c9" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#e6dfd5" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ff6ac1" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="400" cy="200" r="210" fill="url(#goldGlow)"/>
  <!-- Cryolite Observatory Dome Grid (Bolygórózsa) -->
  <g stroke="#5ce6c9" stroke-opacity="0.18" fill="none" stroke-width="1">
    <ellipse cx="400" cy="480" rx="360" ry="260"/>
    <ellipse cx="400" cy="480" rx="280" ry="200"/>
    <ellipse cx="400" cy="480" rx="200" ry="140"/>
    <line x1="400" y1="40" x2="400" y2="480"/>
