  </g>
  <!-- Golden Winged Giant Cobra-Dragon Silhouette (Megaira / Caroline-Blindamoor V. von Anstetten) -->
  <path d="M180,260 C210,120 310,95 400,135 C490,95 590,120 620,260 C550,210 475,215 400,250 C325,215 250,210 180,260 Z"
        fill="none" stroke="#f0c05a" stroke-width="2.2" stroke-opacity="0.72"/>
  <path d="M370,150 Q400,85 430,150 Q400,205 370,150 Z" fill="#f0c05a" fill-opacity="0.16" stroke="#f0c05a" stroke-width="1.6"/>
