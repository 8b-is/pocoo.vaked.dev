  <circle cx="400" cy="275" r="78" fill="none" stroke="url(#zeroZone)" stroke-width="2.5" stroke-dasharray="6 4"/>
  <circle cx="400" cy="275" r="70" fill="none" stroke="#5ce6c9" stroke-width="1.2" stroke-opacity="0.5"/>
  <!-- Colonel Brett Shaw (Black Hood Silhouette + Tipheret Solar Core + Vajra Cybernetic Filaments) -->
  <path d="M362,355 L376,238 L400,212 L424,238 L438,355 Z" fill="#05060b" stroke="#9fd8e8" stroke-width="1.8"/>
  <circle cx="400" cy="275" r="10" fill="#f0c05a"/>
  <circle cx="400" cy="275" r="20" fill="none" stroke="#f0c05a" stroke-width="1.1" stroke-opacity="0.65"/>
  <!-- Amber Porch Lamp Bookmark -->
  <circle cx="690" cy="410" r="7" fill="#f0c05a"/>
  <circle cx="690" cy="410" r="18" fill="#f0c05a" fill-opacity="0.22"/>
  <text x="400" y="448" text-anchor="middle" fill="#f0c05a" font-family="SF Mono, monospace" font-size="12" letter-spacing="5">SHAW-CIKLUS · EMBER + MEGAIRA · 22/9 HZ</text>
  <text x="400" y="470" text-anchor="middle" fill="#5ce6c9" font-family="SF Mono, monospace" font-size="9.5" letter-spacing="3">{-1: HALMER} ──► {0: ZÉRÓJELŰ ZÓNA / TIPHERET} ──► {+1: BOLYGÓRÓZSA}</text>
</svg>
