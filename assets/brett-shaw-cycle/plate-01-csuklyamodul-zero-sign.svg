  <circle cx="695" cy="375" r="6" fill="#f0c05a"/>
  <text x="400" y="395" text-anchor="middle" fill="#9fd8e8" font-family="SF Mono, monospace" font-size="11" letter-spacing="4">PLATE I · CSUKLYAMODUL &amp; ZÉRÓJELŰ ZÓNA (TRIT 0)</text>
  <text x="400" y="416" text-anchor="middle" fill="#7d7696" font-family="SF Mono, monospace" font-size="9" letter-spacing="2">MIND A KÉT TÍPUSÚ TÖLTÉST VONZZA ÉS TASZÍTJA EGYSZERRE · STILL HEART = INVISIBLE</text>
</svg>
