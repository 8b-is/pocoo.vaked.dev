<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440">
  <rect width="800" height="440" fill="#050811"/>
  <!-- 7 Sephirotic Steps in 0°C Frost -->
  <g fill="#0c1526" stroke="#9fd8e8" stroke-width="1.4" stroke-opacity="0.7">
    <rect x="160" y="320" width="480" height="18"/>
    <rect x="190" y="298" width="420" height="18"/>
    <rect x="220" y="276" width="360" height="18"/>
    <rect x="250" y="254" width="300" height="18"/>
    <rect x="280" y="232" width="240" height="18"/>
    <rect x="310" y="210" width="180" height="18"/>
    <rect x="340" y="188" width="120" height="18"/>
  </g>
  <!-- Beryllium-Agate Throne at 0.0°C & Simple Headband -->
  <polygon points="370,188 400,105 430,188" fill="#13243b" stroke="#5ce6c9" stroke-width="2"/>
  <line x1="382" y1="138" x2="418" y2="138" stroke="#f0c05a" stroke-width="3"/>
  <!-- Battle Octahedrons (Harci Oktaéderek) -->
  <polygon points="270,150 290,125 310,150 290,175" fill="none" stroke="#b98cc0" stroke-width="1.6"/>
  <polygon points="490,150 510,125 530,150 510,175" fill="none" stroke="#b98cc0" stroke-width="1.6"/>
  <!-- Peter Shaw "Gyémántszív" at the base of the stair -->
  <polygon points="400,346 412,362 400,378 388,362" fill="#5ce6c9"/>
  <circle cx="695" cy="375" r="6" fill="#f0c05a"/>
  <text x="400" y="402" text-anchor="middle" fill="#9fd8e8" font-family="SF Mono, monospace" font-size="11" letter-spacing="4">PLATE III · THE 0 °C THRONE &amp; PETER SHAW ("GYÉMÁNTSZÍV")</text>
  <text x="400" y="422" text-anchor="middle" fill="#7d7696" font-family="SF Mono, monospace" font-size="9" letter-spacing="2">IV. VON ANSTETTEN · THE SIMPLE HEADBAND · „BARÁTOM”</text>
</svg>
