<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#122018" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <radialGradient id="glow-ice" cx="26%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#9fd8e8" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#9fd8e8" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#9fd8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="64%" cy="48%" r="42%">
      <stop offset="0%" stop-color="#b98cc0" stop-opacity="0.24"/>
      <stop offset="60%" stop-color="#b98cc0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#b98cc0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame-stroke" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b98cc0" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#4a4260" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9fd8e8" stop-opacity="0.6"/>
