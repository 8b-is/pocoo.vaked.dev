  <circle cx="620" cy="290" r="1.5" fill="#9fd8e8"/>
  <circle cx="620" cy="290" r="14" fill="none" stroke="#9fd8e8" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="2 3"/>
  <circle cx="620" cy="290" r="32" fill="none" stroke="#4a4260" stroke-width="0.75" stroke-opacity="0.25" stroke-dasharray="1 5"/>

