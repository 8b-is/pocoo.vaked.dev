    <line x1="570" y1="350" x2="570" y2="354"/>
    <line x1="470" y1="380" x2="470" y2="384"/>
    <line x1="510" y1="380" x2="510" y2="384"/>
    <line x1="550" y1="380" x2="550" y2="384"/>
