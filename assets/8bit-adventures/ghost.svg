    <line x1="620" y1="290" x2="80" y2="460"/>
    <line x1="620" y1="290" x2="80" y2="510"/>
    <line x1="620" y1="290" x2="740" y2="140"/>
    <line x1="620" y1="290" x2="740" y2="200"/>
    <line x1="620" y1="290" x2="740" y2="380"/>
    <line x1="620" y1="290" x2="740" y2="440"/>
    <line x1="620" y1="290" x2="740" y2="500"/>
