  <path d="M 250 290 C 248 350, 248 430, 250 503" fill="none" stroke="#9fd8e8" stroke-width="0.75" stroke-opacity="0.6"/>
  <path d="M 270 290 C 272 350, 270 430, 268 503" fill="none" stroke="#9fd8e8" stroke-width="0.75" stroke-opacity="0.6"/>

