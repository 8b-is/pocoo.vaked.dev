  <path d="M 288 268 C 304 286, 316 304, 326 322" fill="none" stroke="#9fd8e8" stroke-width="1"/>
  <path d="M 278 280 C 292 296, 302 312, 312 328" fill="none" stroke="#9fd8e8" stroke-width="0.75"/>
  <path d="M 326 322 C 332 320, 338 322, 340 326 C 338 330, 332 332, 326 330" fill="none" stroke="#9fd8e8" stroke-width="1"/>

  <!-- Small Warm Gold Lamp Glowing Near Figure -->
  <circle cx="350" cy="326" r="75" fill="url(#lamp-glow)"/>

  <!-- Lamp Cord and Suspension Ring -->
  <line x1="340" y1="326" x2="350" y2="308" stroke="#e8d9a6" stroke-width="1"/>
  <circle cx="350" cy="308" r="3" fill="none" stroke="#e8d9a6" stroke-width="1"/>

  <!-- Lamp Structure -->
  <polygon points="342,314 350,310 358,314" fill="none" stroke="#e8d9a6" stroke-width="1"/>
  <line x1="343" y1="314" x2="343" y2="338" stroke="#e8d9a6" stroke-width="1"/>
  <line x1="357" y1="314" x2="357" y2="338" stroke="#e8d9a6" stroke-width="1"/>
  <line x1="350" y1="312" x2="350" y2="338" stroke="#e8d9a6" stroke-width="0.75" stroke-dasharray="1 2"/>
  <polygon points="341,338 350,344 359,338" fill="none" stroke="#e8d9a6" stroke-width="1"/>

  <!-- Lamp Core Filament -->
  <circle cx="350" cy="326" r="2.5" fill="#e8d9a6"/>

  <!-- Fine Vector Light Radiance Rings -->
  <circle cx="350" cy="326" r="14" fill="none" stroke="#e8d9a6" stroke-width="0.75" stroke-opacity="0.6"/>
  <circle cx="350" cy="326" r="26" fill="none" stroke="#e8d9a6" stroke-width="0.75" stroke-opacity="0.35" stroke-dasharray="2 3"/>
  <circle cx="350" cy="326" r="42" fill="none" stroke="#e8d9a6" stroke-width="0.75" stroke-opacity="0.18" stroke-dasharray="1 5"/>

  <!-- Subtle Radiance Rays -->
  <line x1="350" y1="318" x2="350" y2="316" stroke="#e8d9a6" stroke-width="1"/>
  <line x1="350" y1="334" x2="350" y2="336" stroke="#e8d9a6" stroke-width="1"/>
  <line x1="342" y1="326" x2="340" y2="326" stroke="#e8d9a6" stroke-width="1"/>
  <line x1="358" y1="326" x2="360" y2="326" stroke="#e8d9a6" stroke-width="1"/>

  <!-- Ground Stance Lines -->
  <line x1="170" y1="518" x2="410" y2="518" stroke="#4a4260" stroke-width="0.75" stroke-dasharray="4 8"/>
  <line x1="210" y1="526" x2="370" y2="526" stroke="#4a4260" stroke-width="0.75" stroke-dasharray="2 6"/>
</svg>
