<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#122018" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
    <radialGradient id="glow-ice" cx="32%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#9fd8e8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#9fd8e8" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#9fd8e8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-violet" cx="74%" cy="48%" r="44%">
      <stop offset="0%" stop-color="#b98cc0" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#b98cc0" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#b98cc0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e8d9a6" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#e8d9a6" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e8d9a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame-stroke" x1="0" y1="0" x2="800" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9fd8e8" stop-opacity="0.6"/>
      <stop offset="45%" stop-color="#4a4260" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#e8d9a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b98cc0" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background and Base Grids -->
  <rect width="800" height="600" fill="#0b0a12"/>
  <rect width="800" height="600" fill="url(#grid)"/>

  <!-- Two Soft Ambient Glows -->
  <rect width="800" height="600" fill="url(#glow-ice)"/>
  <rect width="800" height="600" fill="url(#glow-violet)"/>

  <!-- Outer Frame -->
  <rect x="14" y="14" width="772" height="572" rx="12" fill="none" stroke="url(#frame-stroke)" stroke-width="1.5"/>

  <!-- Header and Metadata Labels -->
  <text x="48" y="58" font-family="'SF Mono', ui-monospace, monospace" font-size="12" letter-spacing="3px" fill="#cfc9dd">GHOST</text>
  <text x="48" y="78" font-family="'SF Mono', ui-monospace, monospace" font-size="10" letter-spacing="3px" fill="#4a4260">KEEPS</text>
  <text x="752" y="58" text-anchor="end" font-family="'SF Mono', ui-monospace, monospace" font-size="10" letter-spacing="3px" fill="#4a4260">ARCHIVE / ROW 00</text>
  <text x="752" y="556" text-anchor="end" font-family="'SF Mono', ui-monospace, monospace" font-size="10" letter-spacing="3px" fill="#4a4260">800 X 600 · 01</text>

  <!-- Endless Archive: Perspective Lines Receding to Vanishing Point (620, 290) -->
  <g stroke="#4a4260" stroke-width="0.75" stroke-opacity="0.35">
    <line x1="620" y1="290" x2="80" y2="130"/>
    <line x1="620" y1="290" x2="80" y2="180"/>
    <line x1="620" y1="290" x2="80" y2="240"/>
    <line x1="620" y1="290" x2="80" y2="340"/>
