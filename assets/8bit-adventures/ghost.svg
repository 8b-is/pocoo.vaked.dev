  <path d="M 292 256 C 298 290, 300 330, 298 380 C 296 425, 298 465, 304 502" fill="none" stroke="#9fd8e8" stroke-width="1.25"/>
  <path d="M 220 502 Q 262 508 304 502" fill="none" stroke="#9fd8e8" stroke-width="1.25"/>

