    <line x1="90" y1="260" x2="730" y2="260"/>
    <line x1="90" y1="275" x2="730" y2="275" stroke-dasharray="2 8"/>
    <line x1="90" y1="290" x2="730" y2="290" stroke="#9fd8e8" stroke-opacity="0.45"/>
    <line x1="90" y1="305" x2="730" y2="305" stroke-dasharray="2 8"/>
    <line x1="90" y1="320" x2="730" y2="320"/>
    <line x1="90" y1="335" x2="730" y2="335" stroke-dasharray="1 6"/>
    <line x1="90" y1="350" x2="730" y2="350"/>
    <line x1="90" y1="365" x2="730" y2="365" stroke-dasharray="3 12"/>
    <line x1="90" y1="380" x2="730" y2="380"/>
    <line x1="90" y1="395" x2="730" y2="395" stroke-dasharray="1 8"/>
    <line x1="90" y1="410" x2="730" y2="410"/>
    <line x1="90" y1="425" x2="730" y2="425" stroke-dasharray="2 10"/>
    <line x1="90" y1="440" x2="730" y2="440"/>
    <line x1="90" y1="455" x2="730" y2="455" stroke-dasharray="1 6"/>
    <line x1="90" y1="470" x2="730" y2="470"/>
    <line x1="90" y1="485" x2="730" y2="485" stroke-dasharray="2 10"/>
