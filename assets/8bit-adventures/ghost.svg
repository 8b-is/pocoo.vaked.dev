  <!-- Luminous Patient Figure (Centred-Left at x=260) -->
  <!-- Subtle Halo Rings -->
  <circle cx="260" cy="216" r="38" fill="none" stroke="#9fd8e8" stroke-width="0.75" stroke-opacity="0.45" stroke-dasharray="3 3"/>
  <circle cx="260" cy="216" r="48" fill="none" stroke="#9fd8e8" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Head Contour & Serene Features -->
  <path d="M 250 186 C 257 182, 265 182, 271 186 C 279 192, 281 206, 278 218 C 275 228, 268 234, 260 234 C 252 234, 245 228, 242 218 C 239 206, 241 192, 250 186 Z" fill="none" stroke="#9fd8e8" stroke-width="1.25"/>
