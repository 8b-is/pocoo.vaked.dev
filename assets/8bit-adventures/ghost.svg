  <path d="M 260 258 L 260 504" fill="none" stroke="#9fd8e8" stroke-width="0.75"/>
  <path d="M 242 264 C 238 320, 236 410, 238 502" fill="none" stroke="#9fd8e8" stroke-width="0.75" stroke-opacity="0.8"/>
